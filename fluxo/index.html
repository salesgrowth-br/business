<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: coluna única de leitura, abas fixas no topo, cada mensagem é um balão de WhatsApp com botão de copiar */
:root{
  --bg:#030308; --s1:#08091a; --s2:#0b0d25; --s3:#101438;
  --line:rgba(255,255,255,.07); --line-hi:rgba(0,64,255,.35);
  --blue:#0015FF; --blue-t:#8aa3ff; --amber:#e8a864; --green:#4ade80;
  --t1:#ffffff; --t2:#d0d3e0; --t3:#8a8ea0; --t4:#565a6e;
  --bubble:#0b0d25; --bubble-line:rgba(0,64,255,.32);
  --fd:"Inclusive Sans",system-ui,sans-serif; --fm:"Sora",ui-monospace,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--t2);font-family:var(--fd);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
header.top{padding-block:28px 18px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-t)}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1;color:var(--t1);margin:0;font-weight:400;text-wrap:balance}
.lead{color:var(--t3);margin:0;max-width:62ch}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-family:var(--fm);font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--t2);background:var(--s1)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--fm);font-size:12.5px;color:var(--t3);background:none;border:1px solid transparent;border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab .n{color:var(--t4);margin-right:6px}
.tab[aria-selected="true"]{color:var(--t1);border-color:var(--line-hi);background:var(--s2)}
.tab:focus-visible,.copy:focus-visible{outline:2px solid var(--blue-t);outline-offset:2px}
section.sec{padding-top:24px}
.sec-head h2{font-size:22px;color:var(--t1);margin:0 0 4px;font-weight:400}
.sec-head p{margin:0;color:var(--t3);max-width:64ch}
.group{margin-top:28px}
.group > h3{font-family:var(--fm);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0 0 4px;font-weight:500}
.group > .gnote{color:var(--t3);margin:0 0 12px;font-size:14px}
.item{border-top:1px solid var(--line);padding-block:16px;display:grid;gap:10px}
.item-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.tag{font-family:var(--fm);font-size:11px;color:var(--blue-t);background:var(--s2);border:1px solid var(--line-hi);padding:2px 8px;border-radius:6px}
.item-title{color:var(--t1);font-size:16px}
.when{color:var(--t4);font-size:13px;width:100%}
.bubbles{display:grid;gap:8px}
.bubble{display:flex;gap:10px;align-items:flex-start;background:var(--bubble);border:1px solid var(--bubble-line);border-radius:12px 12px 4px 12px;padding:11px 12px;max-width:640px}
.bubble p{margin:0;color:var(--t1);flex:1;min-width:0;white-space:pre-wrap}
.part{font-family:var(--fm);font-size:10.5px;color:var(--blue-t);display:block;margin-bottom:3px;letter-spacing:.06em}
.copy{font-family:var(--fm);font-size:11px;color:var(--t2);background:var(--s3);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;flex:none}
.copy.ok{color:var(--blue-t);border-color:var(--bubble-line)}
.next{display:flex;flex-wrap:wrap;gap:6px}
.next span{font-size:12.5px;color:var(--t3);background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.next b{color:var(--t2);font-weight:500}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.emo{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.emo .e{font-size:20px;line-height:1}
.emo small{color:var(--t3);font-size:13px}
.foot{margin-top:40px;color:var(--t4);font-size:12px;font-family:var(--fm)}
@media (prefers-reduced-motion:no-preference){.copy{transition:color .15s,border-color .15s}}
</style>

     {tag:"12", title:"Não confio em anúncio", parts:["Entendo a desconfiança, tem muita promessa por aí. Prefiro te mostrar como eu analisaria público, investimento e resultado antes de qualquer coisa. Faz sentido?"]},

 {id:"reativacao", n:"04", label:"Reativação", title:"Conversas que esfriaram",

  groups:[{title:"Cenários", items:[

const tabs=document.getElementById('tabs'), content=document.getElementById('content');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(sec){
  let h=`<section class="sec" id="${sec.id}"><div class="sec-head"><h2>${sec.title}</h2><p>${sec.intro}</p></div>`;
  if(sec.emojis){
    h+=`<div class="emoji-grid">${sec.emojis.map(([e,t])=>`<div class="emo"><span class="e">${e}</span><small>${esc(t)}</small></div>`).join('')}</div>`;
  }
  (sec.groups||[]).forEach(g=>{
    h+=`<div class="group"><h3>${g.title}</h3>${g.note?`<p class="gnote">${g.note}</p>`:''}`;
    g.items.forEach(it=>{
      h+=`<div class="item"><div class="item-head"><span class="tag">${it.tag}</span><span class="item-title">${it.title}</span>${it.when?`<span class="when">${it.when}</span>`:''}</div><div class="bubbles">`;
      it.parts.forEach((p,i)=>{
        h+=`<div class="bubble"><p>${it.parts.length>1?`<span class="part">PARTE ${i+1}</span>`:''}${esc(p)}</p><button class="copy" type="button" data-t="${encodeURIComponent(p)}">Copiar</button></div>`;
      });
      h+=`</div>`;
      if(it.next) h+=`<div class="next">${it.next.map(([a,b])=>`<span><b>${a}</b> → ${b}</span>`).join('')}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  return h+`</section>`;
}
function show(id){
  const sec=S.find(s=>s.id===id)||S[0];
  content.innerHTML=render(sec);
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===sec.id));
  try{localStorage.setItem('fluxo-tab',sec.id)}catch(e){}
}
S.forEach(s=>{const b=document.createElement('button');b.className='tab';b.type='button';b.setAttribute('role','tab');b.dataset.id=s.id;b.innerHTML=`<span class="n">${s.n}</span>${s.label}`;b.onclick=()=>{show(s.id);window.scrollTo({top:0})};tabs.appendChild(b)});
content.addEventListener('click',e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  const t=decodeURIComponent(b.dataset.t);
  const done=()=>{b.textContent='Copiado';b.classList.add('ok');setTimeout(()=>{b.textContent='Copiar';b.classList.remove('ok')},1500)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selecionado';};
  try{navigator.clipboard.writeText(t).then(done,fallback)}catch(err){fallback()}
});
